name: Gerar EPGs

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      
      - name: Run scraper guiadetv
        run: python Scrapers/scraper_guiadetv.py
      
      - name: Run scraper meuguia
        run: python Scrapers/scraper_meuguia.py
      
      - name: Run scraper tvplus
        run: python Scrapers/scraper_tvplus.py
      
      - name: Run scraper mitv
        run: python Scrapers/scraper_mitv.py
      
      - name: Commit and push
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add epg_guiadetv.xml epg_meuguia.xml epg_tvplus.xml epg_mitv.xml
          git commit -m "Atualiza EPGs $(date +%Y-%m-%d_%H:%M)"
          git push
