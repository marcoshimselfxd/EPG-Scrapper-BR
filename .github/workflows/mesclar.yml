name: Mesclar EPGs

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run mesclador
        run: python mesclador.py
      - name: Commit and push
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add epg.xml
          git commit -m "Atualiza EPG mesclado $(date +%Y-%m-%d_%H:%M)"
          git pull --rebase
          git push
